<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sky Room</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.16.0/dist/mqtt.min.js"></script>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "./js/net.js": "./js/net.js?v=1"
} }
</script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #8ec9ff; font: 600 15px/1.35 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1b2130; }
canvas { display: block; touch-action: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

#menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: linear-gradient(#6fb6ff, #cfe8ff); z-index: 10; }
.card { width: 100%; max-width: 400px; background: #fff; border-radius: 18px; padding: 26px 22px; box-shadow: 0 10px 40px rgba(20, 40, 90, .25); }
.card h1 { margin: 0; font-size: 30px; font-weight: 900; }
.card .sub { margin: 4px 0 18px; color: #5d6780; font-weight: 500; }
label { display: block; font-size: 12px; font-weight: 800; color: #5d6780; text-transform: uppercase; letter-spacing: .05em; margin: 14px 0 6px; }
.field { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid #d6dcea; background: #f4f6fb; outline: none; }
.field:focus { border-color: #4f6bff; }
#code { text-transform: uppercase; letter-spacing: .12em; font-weight: 800; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; padding: 0; }
.swatch.on { border-color: #1b2130; }
.row { display: flex; gap: 8px; }
.btn { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 800; background: #4f6bff; color: #fff; }
.btn.ghost { background: #eef1f8; color: #1b2130; }
.btn:disabled { opacity: .5; cursor: default; }
.wide { width: 100%; }
.or { text-align: center; color: #8a93a8; font-size: 13px; margin: 14px 0 0; }
#status { min-height: 20px; margin-top: 12px; font-size: 13px; color: #5d6780; }
#status.err { color: #d63a42; }

#hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .45); }
#hud .box { position: absolute; background: rgba(15, 25, 50, .45); border-radius: 12px; padding: 8px 12px; text-shadow: none; }
#room { top: 12px; left: 12px; pointer-events: auto; display: flex; align-items: center; gap: 10px; }
#room b { letter-spacing: .12em; }
#room button { border: 0; border-radius: 8px; background: #fff; color: #1b2130; padding: 5px 10px; font-weight: 800; font-size: 13px; }
#board { top: 12px; right: 12px; min-width: 170px; }
#board .p { display: flex; align-items: center; gap: 8px; }
#board .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
#board .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#board .me { font-weight: 900; }
#feed { position: absolute; top: 64px; left: 12px; display: flex; flex-direction: column; gap: 4px; }
#feed div { background: rgba(15, 25, 50, .45); border-radius: 8px; padding: 4px 10px; animation: fade 4s forwards; }
@keyframes fade { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }
#help { bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 13px; white-space: nowrap; }
#banner { position: absolute; top: 40%; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 900; }

#touch { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
#stick { position: absolute; left: 24px; bottom: 24px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255, 255, 255, .2); border: 2px solid rgba(255, 255, 255, .5); pointer-events: auto; }
#knob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 255, 255, .7); }
.tbtn { position: absolute; width: 74px; height: 74px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .6); background: rgba(255, 255, 255, .25); color: #fff; font-weight: 900; pointer-events: auto; }
#tjump { right: 24px; bottom: 30px; }
#tshove { right: 110px; bottom: 60px; }
@media (max-width: 600px) { #help { display: none; } #board { min-width: 130px; font-size: 13px; } }
</style>
</head>
<body>
<div id="menu">
  <div class="card">
    <h1>Sky Room</h1>
    <p class="sub">Hang out on a floating island with friends. Shove them off the edge!</p>
    <label for="name">Your name</label>
    <input id="name" class="field" maxlength="14" autocomplete="off" placeholder="Player">
    <label>Colour</label>
    <div class="swatches" id="swatches"></div>
    <label for="code">Room code</label>
    <div class="row">
      <input id="code" class="field" maxlength="5" autocomplete="off" placeholder="ABCDE">
      <button class="btn" id="joinBtn">Join</button>
    </div>
    <p class="or">or</p>
    <div class="row">
      <button class="btn wide" id="hostBtn">Host a room</button>
      <button class="btn ghost" id="soloBtn">Solo</button>
    </div>
    <div id="status"></div>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="room" class="box"><span>Room <b id="roomCode"></b></span><button id="copyBtn">Copy invite link</button></div>
  <div id="board" class="box"></div>
  <div id="feed"></div>
  <div id="help" class="box">WASD move · Space jump · F or click shove · drag or arrow keys to look</div>
  <div id="banner"></div>
</div>

<div id="touch" class="hidden">
  <div id="stick"><div id="knob"></div></div>
  <button class="tbtn" id="tshove">SHOVE</button>
  <button class="tbtn" id="tjump">JUMP</button>
</div>

<script type="module" src="js/main.js?v=1"></script>
</body>
</html>
