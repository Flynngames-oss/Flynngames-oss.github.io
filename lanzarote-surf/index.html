<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wobble Surf Lanzarote</title>
<meta name="description" content="A wobbly ragdoll surfing game on the real island of Lanzarote, with the whole island to explore.">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #06121c; overflow: hidden; }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; color: #fffaf0; font: 800 28px 'Lilita One', system-ui, sans-serif; letter-spacing: .03em; }
  #wait[hidden] { display: none; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; z-index: 1; background: transparent; }
  iframe.off { visibility: hidden; pointer-events: none; z-index: 0; }
</style>
</head>
<body>
<div id="wait">Loading Lanzarote…</div>
<script>
const SHELL = { pages: { surf: 'surf.html', life: 'life/index.html' }, base: { life: 'life/' } };
// One page, two games. The page shows either the surf game or the island; walking up the beach or going
// surfing reloads this same page into the other game (only one is ever loaded, which keeps it light).
(function () {
  const h = location.hash.slice(1).match(/^(surf|life)(?:-(\w+))?$/);
  let which = 'surf', q = location.search;
  if (h) { which = h[1]; q = h[2] ? (which === 'life' ? '?at=' : '?spot=') + h[2] : ''; }
  else if (/[?&]at=/.test(q)) which = 'life';
  window.__QUERY = q;
  window.__LANZ_GO = (w, qq) => {
    const v = new URLSearchParams(qq || '').get(w === 'life' ? 'at' : 'spot');
    location.hash = w + (v ? '-' + v : '');
    location.reload();
  };
  const fail = (e) => { const el = document.getElementById('wait'); if (el) el.textContent = 'Could not load the game: ' + (e && e.message || e); };
  fetch(SHELL.pages[which]).then((r) => { if (!r.ok) throw new Error(r.status + ' ' + SHELL.pages[which]); return r.text(); }).then((html) => {
    if (SHELL.base && SHELL.base[which]) html = html.replace(/<head>/i, '<head><base href="' + SHELL.base[which] + '">');
    document.open(); document.write(html); document.close();
  }).catch(fail);
})();
</script>
</body>
</html>
