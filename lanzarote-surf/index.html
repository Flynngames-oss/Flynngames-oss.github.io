<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wobble Surf Lanzarote</title>
<meta name="description" content="A wobbly ragdoll surfing game on the real island of Lanzarote, with the whole island to explore.">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #06121c; overflow: hidden; }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; color: #fffaf0; font: 800 28px 'Lilita One', system-ui, sans-serif; letter-spacing: .03em; }
  #wait[hidden] { display: none; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; z-index: 1; background: transparent; }
  iframe.off { visibility: hidden; pointer-events: none; z-index: 0; }
</style>
</head>
<body>
<div id="wait">Loading Lanzarote…</div>
<script>
const SHELL = { srcdoc: false, pages: { surf: 'surf.html', life: 'life/index.html' } };
// One page, two games: surfing and the island each run in their own full-screen frame. The one you're not
// playing stays loaded but paused, so going surfing or walking up the beach is instant after the first time.
window.__LANZ_SHELL = true;
const frames = {}, ready = {}, pending = {};
let cur = null;
const hashFor = (which) => { const q = new URLSearchParams(pending[which] || ''); const v = q.get(which === 'life' ? 'at' : 'spot'); return v ? '#' + (which === 'life' ? 'at-' : 'spot-') + v : ''; };
async function make(which) {
  const f = document.createElement('iframe');
  f.setAttribute('allow', 'fullscreen; autoplay; gamepad');
  f.setAttribute('title', which === 'life' ? 'Lanzarote Life' : 'Wobble Surf');
  f.className = 'off';
  frames[which] = f;
  if (SHELL.srcdoc) f.srcdoc = await (await fetch(SHELL.pages[which])).text(); else f.src = SHELL.pages[which];
  document.body.appendChild(f);
  // a browser that won't run a game inside the page: open the game's own page instead
  setTimeout(() => {
    let ok = false;
    try { ok = !!(f.contentDocument && f.contentDocument.querySelector('canvas')); } catch (e) { ok = false; }
    if (!ok && !ready[which]) location.href = SHELL.pages[which] + hashFor(which);
  }, 9000);
  return f;
}
function show(which) {
  cur = which;
  for (const k in frames) {
    const on = k === which;
    frames[k].classList.toggle('off', !on);
    if (ready[k]) try { frames[k].contentWindow.postMessage({ pause: !on }, '*'); } catch (e) { /* ignore */ }
  }
  document.getElementById('wait').hidden = !!ready[which];
  try { frames[which].contentWindow.focus(); } catch (e) { /* ignore */ }
}
function deliver(t) {
  if (pending[t] === undefined || !ready[t]) return;
  frames[t].contentWindow.postMessage({ arrive: pending[t] }, '*');
  delete pending[t];
}
addEventListener('message', async (e) => {
  const m = e.data || {};
  if (m.go === 'surf' || m.go === 'life') {
    pending[m.go] = m.q || '';
    if (!frames[m.go]) await make(m.go);
    show(m.go); deliver(m.go);
  }
  if (m.ready && frames[m.ready]) {
    ready[m.ready] = true;
    if (cur !== m.ready) frames[m.ready].contentWindow.postMessage({ pause: true }, '*');
    else { document.getElementById('wait').hidden = true; try { frames[m.ready].contentWindow.focus(); } catch (err) { /* ignore */ } }
    deliver(m.ready);
  }
});
{
  const q = location.search, first = /[?&]at=/.test(q) ? 'life' : 'surf';
  pending[first] = q;
  make(first).then(() => show(first));
}
</script>
</body>
</html>
