<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flynn Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.16.0/dist/mqtt.min.js"></script>
<style>
:root {
  --bg: #eef1f7; --panel: #ffffff; --panel2: #f5f7fb; --text: #1b2130; --muted: #6b7489;
  --line: #dde2ec; --accent: #4f6bff; --accent-text: #ffffff; --mine: #4f6bff; --mine-text: #ffffff;
  --theirs: #ffffff; --theirs-text: #1b2130; --ok: #1fb46a; --warn: #e39a12; --bad: #e0464e;
  --shadow: 0 6px 24px rgba(20, 30, 60, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11141c; --panel: #1a1f2b; --panel2: #151a24; --text: #e8ebf3; --muted: #8d96ab;
    --line: #2a3142; --accent: #6d84ff; --accent-text: #ffffff; --mine: #5b74ff; --mine-text: #ffffff;
    --theirs: #232a39; --theirs-text: #e8ebf3; --shadow: 0 6px 24px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 500 15px/1.4 'Nunito', system-ui, sans-serif;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

/* ---------- join screen ---------- */
#join {
  min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
}
.card {
  width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 18px; padding: 28px 24px; box-shadow: var(--shadow);
}
.card h1 { margin: 0 0 4px; font-size: 28px; font-weight: 800; }
.card .sub { margin: 0 0 22px; color: var(--muted); }
label { display: block; font-weight: 700; font-size: 13px; color: var(--muted); margin: 16px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
.field {
  width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel2); outline: none;
}
.field:focus { border-color: var(--accent); }
#roomInput { text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch {
  width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; padding: 0;
  outline-offset: 2px;
}
.swatch.on { border-color: var(--text); }
.row { display: flex; gap: 8px; }
.btn {
  border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 800;
  background: var(--accent); color: var(--accent-text);
}
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
.btn.wide { width: 100%; margin-top: 22px; }
.note { margin-top: 18px; font-size: 13px; color: var(--muted); }
.err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 8px; }
.recent { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--panel2); border-radius: 999px;
  padding: 4px 10px; font-size: 13px; font-weight: 700; letter-spacing: .05em;
}

/* ---------- chat screen ---------- */
#chat { height: 100%; display: flex; flex-direction: column; max-width: 900px; margin: 0 auto; }
header {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.roomname { font-weight: 800; font-size: 17px; letter-spacing: .06em; }
.status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
.spacer { flex: 1; }
.iconbtn {
  border: 1px solid var(--line); background: var(--panel2); border-radius: 9px;
  padding: 6px 10px; font-size: 13px; font-weight: 700; white-space: nowrap;
}
#people {
  background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px;
  display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px;
}
.person { display: flex; align-items: center; gap: 6px; background: var(--panel2); border-radius: 999px; padding: 3px 10px 3px 4px; }
.avatar {
  width: 22px; height: 22px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 11px;
  display: flex; align-items: center; justify-content: center; flex: none;
}
#msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 2px; }
.sys { align-self: center; color: var(--muted); font-size: 12px; margin: 8px 0; text-align: center; }
.msg { display: flex; gap: 8px; max-width: 80%; align-self: flex-start; margin-top: 8px; }
.msg.cont { margin-top: 0; }
.msg.cont .avatar { visibility: hidden; }
.msg.mine { align-self: flex-end; flex-direction: row-reverse; }
.msg .avatar { width: 30px; height: 30px; font-size: 13px; margin-top: 18px; }
.msg.cont .avatar { margin-top: 0; }
.msg .body { min-width: 0; }
.meta { font-size: 12px; color: var(--muted); margin: 0 4px 2px; }
.msg.mine .meta { text-align: right; }
.msg.cont .meta { display: none; }
.bubble {
  background: var(--theirs); color: var(--theirs-text); border: 1px solid var(--line);
  padding: 8px 12px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere;
}
.msg.mine .bubble { background: var(--mine); color: var(--mine-text); border-color: transparent; }
.bubble a { color: inherit; text-decoration: underline; }
.bubble.big { font-size: 34px; line-height: 1.2; background: transparent; border-color: transparent; padding: 2px 4px; }
.msg.mine .bubble.big { background: transparent; }
.time { font-size: 11px; color: var(--muted); margin: 2px 6px 0; }
.msg.mine .time { text-align: right; }
.msg.pending .bubble { opacity: .6; }
#typing { min-height: 22px; padding: 0 18px; font-size: 12px; color: var(--muted); }
footer {
  position: relative; display: flex; gap: 8px; padding: 10px 16px 14px;
  background: var(--panel); border-top: 1px solid var(--line);
}
#text { flex: 1; min-width: 0; }
#emojiPanel {
  position: absolute; bottom: 64px; left: 16px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 8px; box-shadow: var(--shadow);
  display: grid; grid-template-columns: repeat(8, 36px); gap: 2px; max-width: calc(100vw - 32px);
}
#emojiPanel button { border: 0; background: transparent; font-size: 22px; border-radius: 8px; height: 36px; padding: 0; }
#emojiPanel button:hover { background: var(--panel2); }
@media (max-width: 560px) {
  .msg { max-width: 92%; }
  .hide-sm { display: none; }
  #emojiPanel { grid-template-columns: repeat(6, 36px); }
}
</style>
</head>
<body>

<!-- ================= JOIN ================= -->
<section id="join">
  <div class="card">
    <h1>💬 Flynn Chat</h1>
    <p class="sub">Pick a name, then join a room with your friends.</p>

    <label for="nameInput">Your name</label>
    <input id="nameInput" class="field" maxlength="20" placeholder="e.g. Flynn" autocomplete="off">

    <label>Your color</label>
    <div id="swatches" class="swatches"></div>

    <label for="roomInput">Room code</label>
    <div class="row">
      <input id="roomInput" class="field" maxlength="20" placeholder="ROOM CODE" autocomplete="off">
      <button id="newRoomBtn" class="btn ghost" type="button" title="Make a random room code">New</button>
    </div>
    <div id="recent" class="recent"></div>
    <div id="joinErr" class="err"></div>

    <button id="joinBtn" class="btn wide" type="button">Join room</button>

    <p class="note">Anyone with the room code can read the chat, so only share it with people you know. Messages are encrypted with the room code and kept for a while on everyone's device.</p>
  </div>
</section>

<!-- ================= CHAT ================= -->
<section id="chat" class="hidden">
  <header>
    <div>
      <div class="roomname" id="roomName">ROOM</div>
      <div class="status"><span id="dot" class="dot"></span><span id="statusText">Connecting…</span></div>
    </div>
    <div class="spacer"></div>
    <button id="peopleBtn" class="iconbtn" type="button">👥 <span id="peopleCount">1</span></button>
    <button id="copyBtn" class="iconbtn" type="button">🔗 <span class="hide-sm">Invite</span></button>
    <button id="soundBtn" class="iconbtn" type="button" title="Sound on/off">🔔</button>
    <button id="leaveBtn" class="iconbtn" type="button">Leave</button>
  </header>
  <div id="people" class="hidden"></div>
  <div id="msgs" aria-live="polite"></div>
  <div id="typing"></div>
  <footer>
    <button id="emojiBtn" class="iconbtn" type="button" title="Emoji">😀</button>
    <div id="emojiPanel" class="hidden"></div>
    <input id="text" class="field" maxlength="1000" placeholder="Type a message…" autocomplete="off">
    <button id="sendBtn" class="btn" type="button">Send</button>
  </footer>
</section>

<script>
(() => {
'use strict';

// ------------------------------------------------------------------ setup
const $ = (id) => document.getElementById(id);
const COLORS = ['#4f6bff', '#e0464e', '#1fb46a', '#e39a12', '#a64dff', '#ff5fa2', '#13a8c2', '#6d7a90'];
const EMOJI = '😀 😂 🤣 😊 😍 😎 🤔 😮 😢 😭 😡 🥺 😴 🤯 🥳 😇 👍 👎 👏 🙏 💪 👋 🔥 💯 ❤️ 💔 ⭐ 🎉 🎮 🏆 🍕 💀'.split(' ');
const BROKERS = (() => {
  const q = new URLSearchParams(location.search).get('broker');   // test hook: ?broker=ws://127.0.0.1:8888
  if (q) return [q];
  return ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081'];
})();
const HISTORY_MAX = 200;
const AWAY_MS = 25000;      // someone counts as gone after this long with no heartbeat
const BEAT_MS = 8000;

const store = {
  get(k, d) { try { const v = localStorage.getItem('fchat:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fchat:' + k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },
};
const rid = (n = 12) => { const a = crypto.getRandomValues(new Uint8Array(n)); return [...a].map(b => (b % 36).toString(36)).join(''); };

const me = {
  uid: store.get('uid', null) || rid(),
  name: store.get('name', ''),
  color: store.get('color', COLORS[Math.floor(Math.random() * COLORS.length)]),
};
store.set('uid', me.uid);

const S = {
  room: null, key: null, topic: null,
  clients: [],              // one MQTT client per broker; we send on all of them
  seen: new Map(),          // packet id -> time, so duplicates from several brokers are ignored
  msgs: [],                 // sorted by ts
  msgIds: new Set(),
  people: new Map(),        // uid -> { name, color, last, typing }
  typing: false, typingTimer: 0, beatTimer: 0, unread: 0,
  sound: store.get('sound', true),
  syncAnswered: new Set(),
};

// ------------------------------------------------------------------ crypto (key + topic come from the room code)
const enc = new TextEncoder(), dec = new TextDecoder();
async function roomCrypto(code) {
  const k = await crypto.subtle.digest('SHA-256', enc.encode('flynnchat-key:' + code));
  const t = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode('flynnchat-topic:' + code)));
  const hex = [...t.slice(0, 12)].map(b => b.toString(16).padStart(2, '0')).join('');
  return { key: await crypto.subtle.importKey('raw', k, 'AES-GCM', false, ['encrypt', 'decrypt']), topic: 'flynnchat/v1/' + hex };
}
async function seal(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, S.key, enc.encode(JSON.stringify(obj))));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
  return out;
}
async function unseal(buf, key) {
  try {
    const b = new Uint8Array(buf);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, key, b.slice(12));
    const m = JSON.parse(dec.decode(pt));
    return m && typeof m === 'object' && typeof m.t === 'string' ? m : null;
  } catch (e) { return null; }
}

// ------------------------------------------------------------------ network
function connectAll() {
  if (S.clients.length || typeof window.mqtt === 'undefined') { updateStatus(); return; }
  for (const url of BROKERS) {
    let c;
    try {
      c = window.mqtt.connect(url, { clientId: 'fc_' + rid(10), clean: true, connectTimeout: 10000, reconnectPeriod: 3000, keepalive: 30 });
    } catch (e) { continue; }
    c.on('connect', () => { if (S.topic) c.subscribe(S.topic, { qos: 0 }); updateStatus(); if (S.topic) hello(); });
    c.on('close', updateStatus);
    c.on('offline', updateStatus);
    c.on('error', () => {});
    c.on('message', (topic, payload) => { if (topic === S.topic) onPacket(payload, S.key); });
    S.clients.push(c);
  }
  updateStatus();
}
const liveClients = () => S.clients.filter(c => c.connected);
let lastHello = 0;
function hello() {
  // Say hi and ask others for messages we missed. Throttled because several brokers connect at once.
  if (Date.now() - lastHello < 1500) return;
  lastHello = Date.now();
  beat();
  send({ t: 'sync?', uid: me.uid, since: S.msgs.length ? S.msgs[S.msgs.length - 1].ts : 0 });
}
async function send(obj) {
  if (!S.key) return;
  obj.pid = rid(10);
  S.seen.set(obj.pid, Date.now());
  const data = await seal(obj);
  for (const c of liveClients()) { try { c.publish(S.topic, data, { qos: 0 }); } catch (e) { /* ignore */ } }
}
async function onPacket(payload, key) {
  const m = await unseal(payload, key);
  if (!m || key !== S.key || !m.pid || S.seen.has(m.pid)) return;
  S.seen.set(m.pid, Date.now());
  switch (m.t) {
    case 'here': if (m.uid !== me.uid) seePerson(m); break;
    case 'bye': if (S.people.delete(m.uid)) { renderPeople(); renderTyping(); } break;
    case 'msg': if (m.m) { seePerson({ uid: m.m.uid, name: m.m.name, color: m.m.color, typing: false }); addMsg(m.m, true); } break;
    case 'sync?': if (m.uid !== me.uid) beat(); answerSync(m); break;
    case 'sync': S.syncAnswered.add(m.to); if (Array.isArray(m.msgs)) { let n = 0; for (const x of m.msgs) if (addMsg(x, false)) n++; if (n) { saveHistory(); } } break;
  }
}
function answerSync(req) {
  if (req.uid === me.uid) return;
  const mine = S.msgs.filter(x => x.ts > (req.since || 0) - 60000).slice(-100);
  if (!mine.length) return;
  // Wait a random moment; if someone else answers first, we don't need to.
  S.syncAnswered.delete(req.uid);
  setTimeout(() => {
    if (S.syncAnswered.has(req.uid)) return;
    send({ t: 'sync', to: req.uid, msgs: mine });
  }, 200 + Math.random() * 1200);
}
function beat() { send({ t: 'here', uid: me.uid, name: me.name, color: me.color, typing: S.typing }); }
function updateStatus() {
  const n = liveClients().length;
  const dot = $('dot');
  if (typeof window.mqtt === 'undefined') {
    dot.className = 'dot bad'; $('statusText').textContent = 'Could not load chat library (blocked?)';
  } else if (n) {
    dot.className = 'dot ok'; $('statusText').textContent = 'Connected';
  } else {
    dot.className = 'dot'; $('statusText').textContent = 'Connecting…';
  }
  $('sendBtn').disabled = !n;
}

// ------------------------------------------------------------------ people
function seePerson(p) {
  if (!p.uid || p.uid === me.uid) return;
  const was = S.people.get(p.uid);
  S.people.set(p.uid, { name: clean(p.name, 20) || 'Someone', color: safeColor(p.color), last: Date.now(), typing: !!p.typing });
  if (!was) { renderPeople(); sysMsg(`${clean(p.name, 20) || 'Someone'} joined`); }
  else if (was.name !== p.name || was.color !== p.color) renderPeople();
  renderTyping();
}
function prunePeople() {
  let changed = false;
  for (const [uid, p] of S.people) if (Date.now() - p.last > AWAY_MS) { S.people.delete(uid); changed = true; }
  if (changed) { renderPeople(); renderTyping(); }
  for (const [pid, t] of S.seen) if (Date.now() - t > 120000) S.seen.delete(pid);
}
function renderPeople() {
  $('peopleCount').textContent = S.people.size + 1;
  const box = $('people');
  box.textContent = '';
  const list = [{ name: me.name + ' (you)', color: me.color }, ...S.people.values()];
  for (const p of list) {
    const el = document.createElement('div'); el.className = 'person';
    el.append(avatar(p.name, p.color), document.createTextNode(p.name));
    box.append(el);
  }
}
function renderTyping() {
  const who = [...S.people.values()].filter(p => p.typing).map(p => p.name);
  $('typing').textContent = !who.length ? '' : who.length === 1 ? `${who[0]} is typing…` : who.length === 2 ? `${who[0]} and ${who[1]} are typing…` : 'Several people are typing…';
}

// ------------------------------------------------------------------ messages
function clean(s, max) { return String(s == null ? '' : s).replace(/[\u0000-\u0008\u000b-\u001f]/g, '').trim().slice(0, max); }
function safeColor(c) { return /^#[0-9a-f]{6}$/i.test(c) ? c : '#6d7a90'; }
function addMsg(raw, live) {
  if (!raw || typeof raw.id !== 'string' || S.msgIds.has(raw.id)) return false;
  const m = {
    id: raw.id.slice(0, 40), uid: String(raw.uid || '').slice(0, 40), name: clean(raw.name, 20) || 'Someone',
    color: safeColor(raw.color), text: clean(raw.text, 1000), ts: Math.min(Number(raw.ts) || Date.now(), Date.now() + 60000),
  };
  if (!m.text) return false;
  S.msgIds.add(m.id);
  // insert in time order (almost always at the end)
  let i = S.msgs.length;
  while (i > 0 && S.msgs[i - 1].ts > m.ts) i--;
  S.msgs.splice(i, 0, m);
  if (S.msgs.length > HISTORY_MAX) { const gone = S.msgs.shift(); S.msgIds.delete(gone.id); }
  if (i === S.msgs.length - 1) appendMsgEl(m); else renderAll();
  if (live) { saveHistory(); if (m.uid !== me.uid) notify(m); }
  return true;
}
function saveHistory() { if (S.room) store.set('hist:' + S.room, S.msgs.slice(-HISTORY_MAX)); }
function sendText() {
  const text = clean($('text').value, 1000);
  if (!text || !liveClients().length) return;
  const m = { id: rid(14), uid: me.uid, name: me.name, color: me.color, text, ts: Date.now() };
  addMsg(m, true);
  send({ t: 'msg', m });
  $('text').value = '';
  setTyping(false);
  $('emojiPanel').classList.add('hidden');
  $('text').focus();
}

// ------------------------------------------------------------------ rendering
function avatar(name, color) {
  const a = document.createElement('div'); a.className = 'avatar'; a.style.background = color;
  a.textContent = (name || '?').trim().charAt(0).toUpperCase() || '?';
  return a;
}
function fmtTime(ts) {
  const d = new Date(ts), now = new Date();
  const t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return d.toDateString() === now.toDateString() ? t : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + t;
}
function linkify(el, text) {
  const re = /\bhttps?:\/\/[^\s<>"]+/gi;
  let last = 0, mm;
  while ((mm = re.exec(text))) {
    if (mm.index > last) el.append(document.createTextNode(text.slice(last, mm.index)));
    const a = document.createElement('a'); a.href = mm[0]; a.textContent = mm[0];
    a.target = '_blank'; a.rel = 'noopener noreferrer nofollow';
    el.append(a);
    last = mm.index + mm[0].length;
  }
  if (last < text.length) el.append(document.createTextNode(text.slice(last)));
}
const onlyEmoji = (t) => t.length <= 12 && /^(\p{Extended_Pictographic}|\p{Emoji_Component}|‍|️|\s)+$/u.test(t) && /\p{Extended_Pictographic}/u.test(t);
let lastEl = null;
function appendMsgEl(m) {
  const box = $('msgs');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  const prev = lastEl && lastEl._m;
  const cont = prev && prev.uid === m.uid && m.ts - prev.ts < 3 * 60000;
  const el = document.createElement('div');
  el.className = 'msg' + (m.uid === me.uid ? ' mine' : '') + (cont ? ' cont' : '');
  el._m = m;
  const body = document.createElement('div'); body.className = 'body';
  const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = m.uid === me.uid ? 'You' : m.name;
  const bub = document.createElement('div'); bub.className = 'bubble' + (onlyEmoji(m.text) ? ' big' : '');
  linkify(bub, m.text);
  const time = document.createElement('div'); time.className = 'time'; time.textContent = fmtTime(m.ts);
  body.append(meta, bub, time);
  el.append(avatar(m.name, m.color), body);
  if (cont && lastEl) { const t = lastEl.querySelector('.time'); if (t) t.remove(); }
  box.append(el);
  lastEl = el;
  if (nearBottom || m.uid === me.uid) box.scrollTop = box.scrollHeight;
}
function sysMsg(text) {
  const el = document.createElement('div'); el.className = 'sys'; el.textContent = text;
  const box = $('msgs');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  box.append(el); lastEl = null;
  if (nearBottom) box.scrollTop = box.scrollHeight;
}
function renderAll() {
  $('msgs').textContent = ''; lastEl = null;
  sysMsg(`Welcome to room ${S.room}! Share the code or invite link with friends.`);
  for (const m of S.msgs) appendMsgEl(m);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}

// ------------------------------------------------------------------ notifications
let actx = null;
function ding() {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(880, actx.currentTime); o.frequency.exponentialRampToValueAtTime(1320, actx.currentTime + 0.08);
    g.gain.setValueAtTime(0.0001, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.15, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.25);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.26);
  } catch (e) { /* no audio */ }
}
function notify() {
  if (document.hidden) { S.unread++; document.title = `(${S.unread}) Flynn Chat`; }
  ding();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { S.unread = 0; document.title = S.room ? `${S.room} · Flynn Chat` : 'Flynn Chat'; } });
function renderSound() { $('soundBtn').textContent = S.sound ? '🔔' : '🔕'; }

// ------------------------------------------------------------------ typing
function setTyping(on) {
  clearTimeout(S.typingTimer);
  if (on) S.typingTimer = setTimeout(() => setTyping(false), 3000);
  if (S.typing !== on) { S.typing = on; beat(); }
}

// ------------------------------------------------------------------ rooms
function normRoom(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 20); }
function randomRoom() {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const b = crypto.getRandomValues(new Uint8Array(6));
  return [...b].map(x => A[x % A.length]).join('');
}
async function enterRoom(code) {
  const { key, topic } = await roomCrypto(code);
  if (S.topic) for (const c of S.clients) { try { c.unsubscribe(S.topic); } catch (e) { /* ignore */ } }
  Object.assign(S, { room: code, key, topic, msgs: [], msgIds: new Set(), people: new Map(), unread: 0 });
  for (const m of store.get('hist:' + code, [])) addMsg(m, false);
  const recent = [code, ...store.get('recent', []).filter(r => r !== code)].slice(0, 6);
  store.set('recent', recent);
  store.set('lastRoom', code);
  history.replaceState(null, '', '?room=' + encodeURIComponent(code) + (new URLSearchParams(location.search).get('broker') ? '&broker=' + encodeURIComponent(BROKERS[0]) : ''));
  document.title = `${code} · Flynn Chat`;
  $('roomName').textContent = code;
  $('join').classList.add('hidden');
  $('chat').classList.remove('hidden');
  renderAll(); renderPeople(); renderTyping(); renderSound();
  connectAll();
  for (const c of liveClients()) c.subscribe(topic, { qos: 0 });
  lastHello = 0;
  if (liveClients().length) hello();
  clearInterval(S.beatTimer);
  S.beatTimer = setInterval(() => { beat(); prunePeople(); }, BEAT_MS);
  $('text').focus();
}
function leaveRoom() {
  send({ t: 'bye', uid: me.uid });
  clearInterval(S.beatTimer);
  if (S.topic) for (const c of S.clients) { try { c.unsubscribe(S.topic); } catch (e) { /* ignore */ } }
  Object.assign(S, { room: null, key: null, topic: null, people: new Map() });
  history.replaceState(null, '', location.pathname + (new URLSearchParams(location.search).get('broker') ? '?broker=' + encodeURIComponent(BROKERS[0]) : ''));
  document.title = 'Flynn Chat';
  $('chat').classList.add('hidden');
  $('join').classList.remove('hidden');
  showJoin();
}

// ------------------------------------------------------------------ join screen
function showJoin() {
  $('nameInput').value = me.name;
  const sw = $('swatches'); sw.textContent = '';
  for (const c of COLORS) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'swatch' + (c === me.color ? ' on' : '');
    b.style.background = c; b.setAttribute('aria-label', 'Color ' + c);
    b.onclick = () => { me.color = c; store.set('color', c); showJoin(); };
    sw.append(b);
  }
  const rec = $('recent'); rec.textContent = '';
  for (const r of store.get('recent', [])) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = r;
    b.onclick = () => { $('roomInput').value = r; };
    rec.append(b);
  }
}
async function tryJoin() {
  const name = clean($('nameInput').value, 20);
  const room = normRoom($('roomInput').value);
  if (!name) { $('joinErr').textContent = 'Type your name first.'; $('nameInput').focus(); return; }
  if (room.length < 3) { $('joinErr').textContent = 'Room code needs at least 3 letters or numbers (or press New).'; $('roomInput').focus(); return; }
  if (!window.crypto || !crypto.subtle) { $('joinErr').textContent = 'This browser can\'t do encryption here. Open the page over https.'; return; }
  $('joinErr').textContent = '';
  me.name = name; store.set('name', name);
  await enterRoom(room);
}

// ------------------------------------------------------------------ wire up
$('joinBtn').onclick = tryJoin;
$('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('roomInput').focus(); });
$('roomInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryJoin(); });
$('roomInput').addEventListener('input', () => { const v = normRoom($('roomInput').value); if (v !== $('roomInput').value) $('roomInput').value = v; });
$('newRoomBtn').onclick = () => { $('roomInput').value = randomRoom(); };
$('sendBtn').onclick = sendText;
$('text').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } });
$('text').addEventListener('input', () => setTyping(!!$('text').value.trim()));
$('leaveBtn').onclick = leaveRoom;
$('peopleBtn').onclick = () => $('people').classList.toggle('hidden');
$('soundBtn').onclick = () => { S.sound = !S.sound; store.set('sound', S.sound); renderSound(); if (S.sound) ding(); };
$('copyBtn').onclick = async () => {
  const link = location.origin + location.pathname + '?room=' + encodeURIComponent(S.room);
  try { await navigator.clipboard.writeText(link); sysMsg('Invite link copied! Paste it to your friends.'); }
  catch (e) { sysMsg('Invite link: ' + link); }
};
const ep = $('emojiPanel');
for (const em of EMOJI) {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = em;
  b.onclick = () => {
    const t = $('text'), s = t.selectionStart ?? t.value.length, e2 = t.selectionEnd ?? t.value.length;
    t.value = t.value.slice(0, s) + em + t.value.slice(e2);
    t.focus(); t.selectionStart = t.selectionEnd = s + em.length;
  };
  ep.append(b);
}
$('emojiBtn').onclick = () => ep.classList.toggle('hidden');
document.addEventListener('click', e => { if (!ep.contains(e.target) && e.target !== $('emojiBtn')) ep.classList.add('hidden'); });
window.addEventListener('pagehide', () => { if (S.room) send({ t: 'bye', uid: me.uid }); });

showJoin();
const urlRoom = normRoom(new URLSearchParams(location.search).get('room'));
if (urlRoom) $('roomInput').value = urlRoom;
if (urlRoom && me.name) tryJoin();
else if (!me.name) $('nameInput').focus();
else $('roomInput').focus();
})();
</script>
</body>
